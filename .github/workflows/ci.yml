name: ci

# Manual only.
#
# Hosted runners are not part of this project's workflow, and a workflow that
# fires on every push would leave a permanent red cross on a public
# repository for reasons that have nothing to do with the code. The gate is
# `python scripts/check.py`, which runs the same lint, tests, purity check
# and wheel verification locally and for free.
#
# This is kept, and kept correct, so it can be triggered by hand or switched
# back to automatic by restoring the push and pull_request triggers.
on:
  workflow_dispatch:

# Actions defaults to a broadly-scoped token. Nothing here writes to the
# repository, so drop it to read-only.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # SPEC 10 mandates 3.10-3.12. 3.13 is confirmed supported by
        # livekit-agents 1.8.0 and is the maintainer's local version, so it is
        # required rather than allow-failure. See docs/FINDINGS.md D11.
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Tests
        run: pytest

  core-purity:
    # The architectural boundary from SPEC 3.1, as its own required job so a
    # violation is visible in the checks list and not buried in test output.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      # The purity check imports nothing beyond the standard library, so it
      # does not need the framework extras that dominate install time.
      - run: pip install -e . pytest
      - run: pytest tests/test_core_purity.py -v
