name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # SPEC 10 mandates 3.10-3.12. 3.13 is confirmed supported by
        # livekit-agents 1.8.0 and is the maintainer's local version, so it is
        # required rather than allow-failure. See docs/FINDINGS.md D11.
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Tests
        run: pytest

  core-purity:
    # The architectural boundary from SPEC 3.1, as its own required job so a
    # violation is visible in the checks list and not buried in test output.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest tests/test_core_purity.py -v
