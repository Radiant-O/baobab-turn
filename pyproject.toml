[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "baobab-turn"
dynamic = ["version"]
description = "Turn detection for African speech. Framework-agnostic core, thin adapters, contributable language packs."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
keywords = ["turn-detection", "voice-agents", "african-languages", "livekit", "pipecat", "speech"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
]

# core/ has exactly one runtime dependency: YAML, for loading language packs.
# Anything framework-shaped belongs in an optional extra. See SPEC 3.1.
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
livekit = ["livekit-agents>=1.6.1", "livekit-plugins-silero"]
pipecat = ["pipecat-ai"]
all = ["baobab-turn[livekit,pipecat]"]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "pytest-cov",
  "ruff",
]

[project.urls]
Homepage = "https://github.com/Radiant-O/baobab-turn"
Repository = "https://github.com/Radiant-O/baobab-turn"

[tool.hatch.version]
path = "baobab_turn/version.py"

[tool.hatch.build.targets.wheel]
packages = ["baobab_turn"]

[tool.hatch.build.targets.wheel.force-include]
"baobab_turn/packs" = "baobab_turn/packs"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

# Pinned explicitly so CI does not drift when ruff changes its defaults or
# when a contributor has a global config.
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Tests deliberately contain hostile literals -- zero-width spaces, control
# characters, full-width forms -- as fixture data. Escaping them would hide
# what is being tested.
"tests/test_failopen.py" = ["RUF001", "PLE2515"]
"tests/test_markers.py" = ["RUF001"]
# Quotes real Hausa forms from a treebank in its docstring. The IPA-style
# length marker is the actual orthography, not a mistyped colon.
"tools/mine_markers.py" = ["RUF002"]
