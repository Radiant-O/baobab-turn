# Nigerian Pidgin.
#
# Marker content is the first draft from SPEC.md 5.2, written by a speaker.
# Untested against labelled data -- status `experimental`, labelled_turns 0.
#
# The long verbal frames here are the highest-value entries in the file:
# "the thing be say" and "wetin happen be say" announce that a clause is
# coming, which is information no Western-trained detector has. Their final
# word ("say") means nothing alone, which is why longest-match-wins matters.

code: pcm
name: Nigerian Pidgin
region_hint: [NG]
status: experimental
maintainer: ""

tonal: false
tonal_extra_ms: 0

commonly_switches_with: [en-NG, yo, ig, ha]

continuation_markers:
  - {text: "the thing be say", weight: 0.9}
  - {text: "wetin i dey talk be say", weight: 0.95}
  - {text: "wetin happen be say", weight: 0.95}
  - {text: "the reason be say", weight: 0.9}
  # The treebank spells the complementiser "sey", not "say" -- 599 tagged
  # occurrences. Both spellings ship, because a real STT may emit either and
  # a miss here loses the strongest frames in the pack.
  - {text: "sey", weight: 0.7}
  - {text: "the thing be sey", weight: 0.9}
  - {text: "wetin i dey talk be sey", weight: 0.95}
  - {text: "wetin happen be sey", weight: 0.95}
  - {text: "the reason be sey", weight: 0.9}
  - {text: "as e be", weight: 0.8}
  - {text: "as e dey be", weight: 0.85}
  - {text: "na because", weight: 0.85}
  - {text: "make i talk true", weight: 0.8}
  - {text: "wey", weight: 0.7}
  - {text: "make", weight: 0.6}
  - {text: "so", weight: 0.6}
  - {text: "then", weight: 0.6}
  - {text: "because", weight: 0.8}
  - {text: "but", weight: 0.6}
  - {text: "if", weight: 0.7}
  - {text: "when", weight: 0.7}
  - {text: "erm", weight: 0.8}
  - {text: "ehm", weight: 0.8}
  - {text: "ehn", weight: 0.6}
  - {text: "hmm", weight: 0.6}

yield_markers:
  # Added from corpus evidence, not invented. "ba"/"bah" is a tag particle
  # that was absent from this pack: 160 discourse-tagged occurrences, ending
  # the turn 71% and 63% of the time respectively. "hm"/"hmhm" are
  # backchannels -- humming and handing over -- at roughly 68% turn-final.
  # Weights are judged, not copied from the ratios.
  - {text: "ba", weight: 0.75}
  - {text: "bah", weight: 0.7}
  - {text: "hm", weight: 0.7}
  - {text: "hmhm", weight: 0.7}
  - {text: "abi", weight: 0.9}
  - {text: "abi no be so", weight: 0.95}
  - {text: "no be so", weight: 0.9}
  - {text: "shey", weight: 0.85}
  - {text: "you get", weight: 0.85}
  - {text: "you get me", weight: 0.9}
  - {text: "you understand", weight: 0.85}
  - {text: "e clear", weight: 0.85}
  - {text: "e clear so", weight: 0.85}
  - {text: "you dey hear me", weight: 0.85}
  - {text: "you dey follow", weight: 0.85}
  - {text: "na all", weight: 0.85}
  - {text: "na so", weight: 0.7}
  - {text: "nko", weight: 0.8}

ambiguous_markers:
  # Spelling variants of "now" that transcripts actually use. Same weight as
  # "now" because they are the same word; listing them separately only
  # because matching is on the literal string.
  - {text: "nah", weight: 0.2, note: "spelling variant of emphatic 'now'"}
  - {text: "naw", weight: 0.2, note: "spelling variant of emphatic 'now'"}
  - {text: "nau", weight: 0.2, note: "spelling variant of emphatic 'now'"}
  - {text: "sha", weight: 0.4, note: "appears mid-utterance and terminally"}
  - {text: "o", weight: 0.25, note: "'e don finish o' -- usually terminal, never a hard yield"}
  - {text: "now", weight: 0.2, note: "'come now' -- not temporal"}

fillers: ["erm", "ehm", "ehn", "eh", "hmm", "mmm", "ehen"]

# Ordinary Pidgin vocabulary, used ONLY to tell this language apart from a
# neighbour during code-switch detection. These are not turn-taking cues and
# never move the probability -- a wrong entry costs a little misplaced
# patience, not a wrong turn decision.
#
# Needed because Pidgin and Nigerian English share almost all their discourse
# markers, so markers alone cannot discriminate between them. Every word here
# is attested in the corpora rather than invented: `dey` appears in 59% of
# NaijaSenti Pidgin tweets, `wetin` 165 times in CENCOS, `sef` 104, `una` 62,
# `abeg` 37.
profile_words:
  - dey
  - wetin
  - abeg
  - una
  - sabi
  - comot
  - oga
  - wahala
  - pikin
  - naim
  - dem
  - sef
  - waka
  - chop
  - yawa
  - biko
  - pesin
  - sotay

thresholds:
  unlikely_threshold: null
  min_delay_ms: null
  max_delay_ms: null

validation:
  labelled_turns: 0
  dataset_note: >-
    Still 0 labelled turns: no turn has been hand-labelled for this pack.
    Some markers are now corpus-derived rather than guessed -- ba/bah, hm,
    hmhm, the sey spellings and the now variants come from SUD_Naija-NSC
    (CC BY-SA 4.0, Bernard Caron et al.) cross-checked against CENCOS
    (CC BY 4.0, Agbo & Plag, doi 10.5281/zenodo.7314016). Weights are judged
    from those distributions, not copied from them. The rest remain a first
    draft and the pack stays `experimental` until turns are labelled.
